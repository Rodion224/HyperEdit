[package]
name = "hyperedit"
version = "0.1.0"
description = "Spiritual successor to Notepad++ built on Tauri and CodeMirror 6"
authors = ["HyperEdit Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
